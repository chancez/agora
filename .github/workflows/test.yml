# Tests on pull requests and on main.
#
# Both Linux and macOS, even though nothing here is written per platform. agora's constraint is that it is a
# static binary with no cgo, so it can be a hook in the path of every edit on any machine: a matrix is how that
# claim gets checked rather than assumed. The parts most likely to differ are the ones that touch a filesystem,
# and there are several: $XDG_DATA_HOME resolution, /tmp against /var/folders, and the symlinked temp paths that
# make a worktree's own name ambiguous on darwin.
name: test

on:
  pull_request:
  push:
    branches: [main]
  # For re-running against a branch without pushing to it, which is how this workflow was iterated on.
  workflow_dispatch:

# A new push to a PR makes the previous run's answer irrelevant, so stop it rather than pay for both. Not applied
# to main, where each commit's result is worth keeping: the group includes the ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      # One platform failing must not hide the other's result, which is the whole reason for running both.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: macos-15
            name: darwin
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      # go.mod is the single source of truth for the version, so this cannot drift from what a developer builds
      # with. mise.toml pins the same one; a number written here as well would be a second place to update.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The checks mise run check runs, called directly so the workflow needs nothing installed but Go.
      - name: gofmt
        run: |
          set -euo pipefail
          # go fmt rewrites files; this asks whether anything needed rewriting, which is what CI wants.
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Every path agora resolves by default is pointed at an empty directory, and the step after this one checks
      # nothing was written there. A test that forgets to isolate itself otherwise reads and writes the real
      # channel of whoever ran it, which on a developer's machine is a message another agent acts on and here
      # would be a suite passing for the wrong reason. The project's own rule, enforced rather than trusted.
      - name: go test
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
        run: go test ./...

      - name: Check no test wrote to the default paths
        run: |
          set -euo pipefail
          for dir in "${{ runner.temp }}/xdg-data/agora" "${{ runner.temp }}/xdg-config/agora"; do
            if [ -e "$dir" ]; then
              echo "a test wrote to $dir, so it was using the default path rather than a throwaway one:" >&2
              ls -lR "$dir" >&2
              exit 1
            fi
          done
          echo "nothing wrote to the paths agora resolves by default"

      # A separate run rather than the only run. -race widens real windows, and claims and cursors are the two
      # places two agents genuinely race, so it is worth paying for. It also changes timing enough that a failure
      # under it and one without it are different findings, and knowing which fired is the first triage question.
      - name: go test -race
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data-race
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config-race
        run: go test -race ./...

      # Cross-compilation is the no-cgo claim, and it is what lets the release build every target from one
      # runner. Checked on Linux only, since building the same four targets twice proves nothing new.
      - name: Cross-compile every release target
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -o /dev/null ./cmd/agora
            echo "$target ok"
          done

# The scripts in scripts/ are deliberately not run here. Each one starts real agent sessions with the claude CLI,
# which costs tokens and needs credentials, and what they measure is whether an agent changes its behaviour rather
# than whether the code works. They are run by hand when the thing they measure changes; docs/design.md holds the
# numbers from the last run of each.
